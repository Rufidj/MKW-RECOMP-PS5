# MKW-RECOMP-PS5 settings: the configuration tested on a PS5. Copied next to eboot.bin by tools/package.py.
# The hidden menu (Create + Options) changes resolution, fps and graphics in game and saves them in [display].

# Texture size cap. The large sparse arrays only receive their smaller levels, so 1024 loses nothing visible.
TEX_MAX=1024
SPARSE_IMAGES=0

# Output resolution: 1080 (tested, recommended), 720, or original (1440p: sharper, but 46-49 fps in races).
RESOLUTION=1080
# FSR 1 (EASU + RCAS): upscales when the internal resolution is lower, otherwise only sharpens.
UPSCALER=fsr

# Frame rate: leave FPS unset for automatic (real game speed, ~45-56 fps in races).
# FPS=60 forces 60: when a frame takes longer the whole game runs in slow motion.
# FPS=60

# Only the GPU submits whose results the CPU reads back (occlusion queries) wait for the GPU; the rest do not.
SUBMIT_CATCHUP=report

# Released textures kept at most 256 MiB, so long sessions keep memory free.
TEX_RELEASED_MIB=256

# Fence write-backs on 2 extra threads (~2 ms less per frame in busy races).
WB_PAR=2

# Spilling textures to a scratch file needs page drops the console does not offer.
MEM_SPILL=0

# Leave REPLAY_PAR off (replay split over 3 more threads): on a PS5 races fell from ~50 to 20-42 fps, because the
# game's own threads already use the CPU.

# Diagnosis (slower): TRACE=sched,perf

[display]
perf_overlay = off
